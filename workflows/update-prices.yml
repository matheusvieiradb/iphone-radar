name: Atualizar preços iPhone 17

on:
  schedule:
    # Horários em UTC. Brasília é UTC-03:00 o ano todo (sem horário de verão desde 2019):
    #   01:00 UTC = 22:00 BRT (dia anterior) | 09:00 UTC = 06:00 BRT
    #   15:00 UTC = 12:00 BRT               | 20:00 UTC = 17:00 BRT
    - cron: "0 1,9,15,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar coleta de preços
        run: node scripts/update-prices.mjs

      - name: Publicar alterações
        run: |
          git config user.name "iphone-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Nada mudou nesta rodada."
          else
            git commit -m "Atualiza preços iPhone 17"
            git push
          fi
